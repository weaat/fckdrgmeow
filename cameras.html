      { id: 'rem_18', group: 'remote', ch: 'CH-18', name: 'Лестница / Мансарда', ip: '82.119.149.206', stream: 'cam18', video: 'videos/restaurant_cctv/cam_18.mp4', poster: 'images/restaurant_cctv/cam_18.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/1802' },
      { id: 'rem_19', group: 'remote', ch: 'CH-19', name: 'Холл / Входная группа', ip: '82.119.149.206', stream: 'cam19', video: 'videos/restaurant_cctv/cam_19.mp4', poster: 'images/restaurant_cctv/cam_19.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/1902' },
      { id: 'rem_20', group: 'remote', ch: 'CH-20', name: 'Вход / Гардероб', ip: '82.119.149.206', stream: 'cam20', video: 'videos/restaurant_cctv/cam_20.mp4', poster: 'images/restaurant_cctv/cam_20.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/2002' },
      { id: 'rem_21', group: 'remote', ch: 'CH-21', name: 'Двор / Парковка', ip: '82.119.149.206', stream: 'cam21', video: 'videos/restaurant_cctv/cam_21.mp4', poster: 'images/restaurant_cctv/cam_21.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/2102' },
      { id: 'rem_22', group: 'remote', ch: 'CH-22', name: 'Коридор персонала', ip: '82.119.149.206', stream: 'cam22', video: 'videos/restaurant_cctv/cam_22.mp4', poster: 'images/restaurant_cctv/cam_22.jpg', rtsp: 'rtsp://admin123@82.119.149.206:554/Streaming/Channels/2202' },
      { id: 'rem_23', group: 'remote', ch: 'CH-23', name: 'Заготовочный цех', ip: '82.119.149.206', stream: 'cam23', video: 'videos/restaurant_cctv/cam_23.mp4', poster: 'images/restaurant_cctv/cam_23.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/2302' },
      { id: 'rem_24', group: 'remote', ch: 'CH-24', name: 'Служебная лестница', ip: '82.119.149.206', stream: 'cam24', video: 'videos/restaurant_cctv/cam_24.mp4', poster: 'images/restaurant_cctv/cam_24.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/2402' },
      { id: 'rem_25', group: 'remote', ch: 'CH-25', name: 'Заготовочный склад', ip: '82.119.149.206', stream: 'cam25', video: 'videos/restaurant_cctv/cam_25.mp4', poster: 'images/restaurant_cctv/cam_25.jpg', rtsp: 'rtsp://admin:admin123@82.119.149.206:554/Streaming/Channels/2502' }
    ];

    const gridEl = document.getElementById('cctv-standalone-grid');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalCounter = document.getElementById('modal-counter');
    const modalStream = document.getElementById('modal-stream');
    const modalVideo = document.getElementById('modal-video');
    const modalRtspText = document.getElementById('modal-rtsp-text');
    const copyRtspBtn = document.getElementById('copy-rtsp-btn');
    const copyFfplayBtn = document.getElementById('copy-ffplay-btn');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalPrevBtn = document.getElementById('modal-prev-btn');
    const modalNextBtn = document.getElementById('modal-next-btn');
    const clockEl = document.getElementById('cctv-global-clock');
    const tabBtns = document.querySelectorAll('.cctv-tab-btn');

    let currentFilter = 'all';
    let currentIdx = 0;
    let isGatewayOnline = false;

    // Проверка активности go2rtc
    fetch('http://127.0.0.1:1984/api/streams', { method: 'GET', mode: 'no-cors', cache: 'no-store' })
      .then(() => { isGatewayOnline = true; })
      .catch(() => { isGatewayOnline = false; });

    function getVisibleCameras() {
      if (currentFilter === 'all') return CAMERAS_DB;
      return CAMERAS_DB.filter(c => c.group === currentFilter);
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      const list = getVisibleCameras();

      list.forEach((cam, index) => {
        const cell = document.createElement('div');
        cell.className = 'cctv-cell-item';
        cell.title = `${cam.name} (${cam.ip}) — Клик для просмотра`;

        if (cam.poster) {
          cell.innerHTML = `
            <img src="${cam.poster}" alt="${cam.name}" loading="lazy" />
            <video src="${cam.video}" poster="${cam.poster}" loop muted playsinline hidden></video>
          `;
        } else {
          cell.innerHTML = `
            <div class="cctv-cell-placeholder">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M23 7l-7 5 7 5V7z"></path>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <span>${cam.ip}</span>
            </div>
          `;
        }

        cell.innerHTML += `
          <div class="cctv-cell-header-bar">
            <span class="cctv-cell-ch-tag">${cam.ch}</span>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="cctv-cell-ip-tag">${cam.ip}</span>
              <span class="cctv-page-rec-dot" style="width:7px; height:7px;"></span>
            </div>
          </div>
          <div class="cctv-cell-name-bar">
            <span class="cctv-cell-cam-name">${cam.name}</span>
            <span class="cctv-cell-live-clock cctv-time-stamp">00:00:00</span>
          </div>
        `;

        const video = cell.querySelector('video');
        const img = cell.querySelector('img');
        if (video) {
          cell.addEventListener('mouseenter', () => {
            video.hidden = false;
            if (img) img.hidden = true;
            video.play().catch(() => {});
          });
          cell.addEventListener('mouseleave', () => {
            video.pause();
            video.hidden = true;
            if (img) img.hidden = false;
          });
        }

        cell.addEventListener('click', () => openModal(index));
        gridEl.appendChild(cell);
      });
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    function openModal(index) {
      const list = getVisibleCameras();
      if (!list[index]) return;
      currentIdx = index;
      const cam = list[index];

      modalTitle.textContent = `${cam.name} [${cam.ch}]`;
      modalSubtitle.textContent = `IP: ${cam.ip} · Канал: ${cam.stream}`;
      modalCounter.textContent = `Камера ${index + 1} из ${list.length}`;
      modalRtspText.textContent = cam.rtsp;

      if (isGatewayOnline) {
        modalStream.hidden = false;
        modalStream.src = `http://127.0.0.1:1984/stream.html?src=${cam.stream}&background=false`;
        modalVideo.hidden = true;
        modalVideo.pause();
      } else if (cam.video) {
        modalStream.hidden = true;
        modalStream.src = '';
        modalVideo.hidden = false;
        modalVideo.src = cam.video;
        modalVideo.play().catch(() => {});
      } else {
        modalStream.hidden = false;
        modalStream.src = `http://127.0.0.1:1984/stream.html?src=${cam.stream}&background=false`;
        modalVideo.hidden = true;
        modalVideo.pause();
      }

      modalBackdrop.hidden = false;
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalBackdrop.hidden = true;
      modalStream.src = '';
      modalVideo.pause();
      modalVideo.src = '';
      document.body.style.overflow = '';
    }

    copyRtspBtn.addEventListener('click', () => {
      const list = getVisibleCameras();
      const cam = list[currentIdx];
      if (cam) {
        navigator.clipboard.writeText(cam.rtsp);
        copyRtspBtn.textContent = 'Скопировано!';
        setTimeout(() => { copyRtspBtn.textContent = 'Копировать RTSP'; }, 1800);
      }
    });

    copyFfplayBtn.addEventListener('click', () => {
      const list = getVisibleCameras();
      const cam = list[currentIdx];
      if (cam) {
        const cmd = `ffplay -rtsp_transport tcp -fflags nobuffer -flags low_delay "${cam.rtsp}"`;
        navigator.clipboard.writeText(cmd);
        copyFfplayBtn.textContent = 'Команда скопирована!';
        setTimeout(() => { copyFfplayBtn.textContent = 'Команда ffplay'; }, 1800);
      }
    });

    modalCloseBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', e => {
      if (e.target === modalBackdrop) closeModal();
    });

    modalPrevBtn.addEventListener('click', () => {
      const list = getVisibleCameras();
      const prev = currentIdx > 0 ? currentIdx - 1 : list.length - 1;
      openModal(prev);
    });

    modalNextBtn.addEventListener('click', () => {
      const list = getVisibleCameras();
      const next = currentIdx < list.length - 1 ? currentIdx + 1 : 0;
      openModal(next);
    });

    document.addEventListener('keydown', e => {
      if (modalBackdrop.hidden) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') modalPrevBtn.click();
      if (e.key === 'ArrowRight') modalNextBtn.click();
    });

    function updateClocks() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ru-RU', { hour12: false });
      const dateStr = now.toLocaleDateString('ru-RU');
      clockEl.textContent = `${timeStr} ${dateStr}`;
      document.querySelectorAll('.cctv-time-stamp').forEach(el => {
        el.textContent = timeStr;
      });
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    renderGrid();
  </script>
</body>
</html>
